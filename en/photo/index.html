(function(){if(!matchMedia("(hover: hover) and (pointer: fine)").matches)return;document.querySelectorAll(".work a, .cell4").forEach(function(a){var v=a.querySelector("video.clip");if(!v)return;var t;

function off(){v.classList.remove("on");t=setTimeout(function(){v.pause();v.currentTime=0},450)}
a.addEventListener("mouseenter",on);a.addEventListener("mouseleave",off);a.addEventListener("focusin",on);a.addEventListener("focusout",off)})})();
(function(){if(!matchMedia("(hover: hover) and (pointer: fine)").matches)return;var phs=document.querySelectorAll(".ph[data-seq]");if(!phs.length)return;
function preload(ph){if(ph._pl)return;ph._pl=1;ph.dataset.seq.split(",").forEach(function(u){var i=new Image();i.src=u})}
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){preload(e.target);io.unobserve(e.target)}})},{rootMargin:"200px"});phs.forEach(function(p){io.observe(p)})}
phs.forEach(function(ph){var list=ph.dataset.seq.split(","),a=ph.closest("a"),im,i=0,t,pre=[];
function step(){var n=(i+1)%(list.length+1);if(n>0&&!(pre[n-1]&&pre[n-1].complete)){t=setTimeout(step,80);return}i=n;if(i===0){im.style.opacity=0}else{im.src=list[i-1];im.style.opacity=1}t=setTimeout(step,900)}
function on(){preload(ph);if(!pre.length)list.forEach(function(u){var x=new Image();x.src=u;pre.push(x)});if(!im){im=document.createElement("img");im.className="seq";im.alt="";im.setAttribute("aria-hidden","true");ph.appendChild(im)}i=0;im.style.opacity=0;clearTimeout(t);t=setTimeout(step,900)}
function off(){clearTimeout(t);if(im)im.style.opacity=0}
a.addEventListener("mouseenter",on);a.addEventListener("mouseleave",off);a.addEventListener("focusin",on);a.addEventListener("focusout",off)})})();</script>
