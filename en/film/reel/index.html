<script>(function(){document.querySelectorAll(".vposter").forEach(function(b){var btn=b.querySelector(".reel-play");if(!btn)return;
var f=null,ready=false,want=false,shown=false,fb;
function src(auto){return "https://player.vimeo.com/video/"+b.dataset.id+"?dnt=1&playsinline=1&api=1"+(auto?"&autoplay=1":"")}
function send(m,v){try{f.contentWindow.postMessage(JSON.stringify(v===undefined?{method:m}:{method:m,value:v}),"*")}catch(e){}}
function show(){if(shown)return;shown=true;clearTimeout(fb);f.classList.add("on");setTimeout(function(){if(btn.parentNode)btn.parentNode.removeChild(btn)},650)}
function make(auto){if(f)return;f=document.createElement("iframe");f.src=src(auto);f.title=b.dataset.title;f.allow="autoplay; fullscreen; picture-in-picture";b.appendChild(f)}
window.addEventListener("message",function(ev){if(!f||ev.source!==f.contentWindow)return;var d=ev.data;if(typeof d==="string"){try{d=JSON.parse(d)}catch(e){return}}if(!d)return;
if(d.event==="ready"){ready=true;send("addEventListener","play");send("addEventListener","playProgress");if(want)send("play")}
else if(d.event==="play"){if(want)setTimeout(show,120)}
else if(d.event==="playProgress"&&d.data&&d.data.seconds>0.05){if(want)show()}});
function warm(){make(false)}
if(b===document.querySelector(".vposter")&&matchMedia("(hover: hover) and (pointer: fine)").matches)addEventListener("load",function(){setTimeout(warm,800)});
btn.addEventListener("pointerenter",warm);btn.addEventListener("focus",warm);btn.addEventListener("touchstart",warm,{passive:true});
btn.addEventListener("click",function(){if(want)return;want=true;btn.classList.add("loading");
if(!f)make(true);else if(ready)send("play");
fb=setTimeout(function(){if(!shown){f.src=src(true);fb=setTimeout(show,4000)}},2500)})})})();</script>
