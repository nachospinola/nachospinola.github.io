  <div class="proj-body"><div class="proj-extra proj-coll"><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/86915269?dnt=1" title="Venezuela está en la calle" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>Venezuela está en la calle</figcaption><p class="xm">Maracaibo, Venezuela · 2014</p><p class="xt">Made together with Venezuelan friends to give voice to those who protest peacefully day after day. It comes from affection for a person, her family and her country. Special Mention at the Nanometrajes Contest.</p></figure><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/390689166?dnt=1" title="Me despertaré mañana" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>Me despertaré mañana</figcaption><p class="xm">Málaga, Spain · 2019</p><p class="xt">Documentary short about the daily life of an 85-year-old woman: her fears and worries, but also her customs and hopes. A tribute in life to a grandmother, a mother, a daughter. Selected at festivals in Colombia, the United States, Slovakia, Spain and Italy.</p></figure><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/118168728?dnt=1" title="Pa'lante mujer" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>Pa'lante mujer</figcaption><p class="xm">Sevilla, Spain · 2014</p><p class="xt">A message of support to all victims of gender violence, told by a group of women survivors from the Ana Bella Foundation.</p></figure><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/75562480?dnt=1" title="El último socio 2" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>El último socio 2</figcaption><p class="xm">Almería, Spain · 2012</p><p class="xt">Trailer for a socio-cultural project to promote positive leisure among young people and raise funds for A Toda Vela.</p></figure></div></div>
