<article class="proj">
  <header class="proj-head"><h1>Personal</h1></header>
  <div class="proj-body"><div class="proj-extra proj-coll"><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="86915269" data-title="Venezuela está en la calle"><button class="reel-play" type="button" aria-label="Play the video"><img src="/assets/img/film/extras/86915269.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Venezuela está en la calle</figcaption><p class="xm">Maracaibo, Venezuela</p><p class="xt">A video made together with Venezuelan friends to give a voice to those who take to the streets to protest peacefully, day after day. A project born from my personal bond with Venezuela, my wife's country and her family's, and from the need to tell what was happening there.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="390689166" data-title="Me despertaré mañana"><button class="reel-play" type="button" aria-label="Play the video"><img src="/assets/img/film/extras/390689166.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Me despertaré mañana</figcaption><p class="xm">Málaga, Spain</p><p class="xt">A documentary short that portrays my grandmother's everyday life at 90. Her routines, her fears, her worries and those small hopes that still keep her company every day. An intimate portrait and a tribute in life to one of the most important women in my life.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="118168728" data-title="Pa'lante mujer"><button class="reel-play" type="button" aria-label="Play the video"><img src="/assets/img/film/extras/118168728.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Pa'lante mujer</figcaption><p class="xm">Sevilla, Spain</p><p class="xt">One of my first professional projects and one I remember most fondly. A video made together with a group of brave women who shared their experiences to encourage others to break free from gender violence and take their lives back. A project that taught me the power of telling a story. Pa'lante mujer, pa'lante siempre.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="75562480" data-title="El último socio"><button class="reel-play" type="button" aria-label="Play the video"><img src="/assets/img/film/extras/75562480.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>El último socio</figcaption><p class="xm">Almería, Spain</p><p class="xt">My first personal project. A film made together with my lifelong friends, with no means and no experience, but with every desire to tell a story. A small look at our city and its past and, above all, an excuse to create something together that would stay with us forever.</p></figure></div></div>
</article>

var shown=false,t0=Date.now();function show(){if(shown)return;shown=true;f.classList.add("on");setTimeout(function(){if(btn.parentNode)btn.parentNode.removeChild(btn)},650)}
function send(m,v){try{f.contentWindow.postMessage(JSON.stringify({method:m,value:v}),"*")}catch(e){}}
window.addEventListener("message",function(ev){if(ev.source!==f.contentWindow)return;var d=ev.data;if(typeof d==="string"){try{d=JSON.parse(d)}catch(e){return}}if(!d)return;
if(d.event==="ready"){send("addEventListener","play");send("addEventListener","playProgress");setTimeout(show,5000)}
else if(d.event==="play"){setTimeout(show,300)}
else if(d.event==="playProgress"&&d.data&&d.data.seconds>0.05){show()}});
b.appendChild(f)})})})();</script>
