  <div class="proj-body"><div class="proj-extra proj-coll"><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/86915269?dnt=1" title="Venezuela está en la calle" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>Venezuela está en la calle</figcaption><p class="xm">Maracaibo, Venezuela · 2014</p><p class="xt">Hecho junto a amigos venezolanos para dar voz a quienes se manifiestan pacíficamente día tras día. Nace del cariño por una persona, por su familia y por su país. Mención Especial en el Concurso Nanometrajes.</p></figure><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/390689166?dnt=1" title="Me despertaré mañana" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>Me despertaré mañana</figcaption><p class="xm">Málaga, España · 2019</p><p class="xt">Cortometraje documental sobre el día a día de una mujer de 85 años: sus miedos y preocupaciones, pero también sus costumbres y sus ilusiones. Un homenaje en vida para una abuela, una madre, una hija. Seleccionado en festivales de Colombia, Estados Unidos, Eslovaquia, España e Italia.</p></figure><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/118168728?dnt=1" title="Pa'lante mujer" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>Pa'lante mujer</figcaption><p class="xm">Sevilla, España · 2014</p><p class="xt">Mensaje de apoyo a todas las víctimas de violencia de género, contado por un grupo de mujeres supervivientes de la Fundación Ana Bella.</p></figure><figure class="xv xi"><div class="embed"><iframe onload="var f=this;setTimeout(function(){f.classList.add('on')},350)" src="https://player.vimeo.com/video/75562480?dnt=1" title="El último socio 2" allow="fullscreen; picture-in-picture" loading="lazy"></iframe></div><figcaption>El último socio 2</figcaption><p class="xm">Almería, España · 2012</p><p class="xt">Tráiler de un proyecto sociocultural para promover el ocio positivo entre la juventud y recaudar fondos para A Toda Vela.</p></figure></div></div>
