<article class="proj">
  <header class="proj-head"><h1>Personal</h1></header>
  <div class="proj-body"><div class="proj-extra proj-coll"><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="86915269" data-title="Venezuela está en la calle"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/86915269.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Venezuela está en la calle</figcaption><p class="xm">Maracaibo, Venezuela</p><p class="xt">Un vídeo realizado junto a amigos venezolanos para dar voz a quienes salen a las calles a manifestarse pacíficamente, día tras día. Un proyecto que nació de mi vínculo personal con Venezuela, el país de mi esposa y su familia, y de la necesidad de contar lo que allí estaba ocurriendo.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="390689166" data-title="Me despertaré mañana"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/390689166.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Me despertaré mañana</figcaption><p class="xm">Málaga, España</p><p class="xt">Un cortometraje documental que retrata la vida cotidiana de mi abuela a sus 90 años. Sus rutinas, sus miedos, sus preocupaciones y esas pequeñas ilusiones que siguen acompañándola cada día. Un retrato íntimo y un homenaje en vida a una de las mujeres más importantes para mí.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="118168728" data-title="Pa'lante mujer"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/118168728.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Pa'lante mujer</figcaption><p class="xm">Sevilla, España</p><p class="xt">Uno de mis primeros proyectos profesionales y uno de los que recuerdo con más cariño. Un vídeo realizado junto a un grupo de mujeres valientes que compartieron sus experiencias para animar a otras a romper con la violencia machista y recuperar sus vidas. Pa'lante mujer, pa'lante siempre.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="75562480" data-title="El último socio"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/75562480.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>El último socio</figcaption><p class="xm">Almería, España</p><p class="xt">Mi primer proyecto personal. Una película hecha junto a mis amigos de toda la vida, sin medios ni experiencia, pero con todas las ganas de contar una historia. Una pequeña mirada a nuestra ciudad y su pasado, y, sobre todo, una excusa para crear algo juntos que nos acompañaría para siempre.</p></figure></div></div>
</article>

<script>(function(){document.querySelectorAll(".vposter").forEach(function(b){var btn=b.querySelector(".reel-play");if(!btn)return;
var f=null,ready=false,want=false,shown=false,fb;
function src(auto){return "https://player.vimeo.com/video/"+b.dataset.id+"?dnt=1&playsinline=1&api=1"+(auto?"&autoplay=1":"")}
function send(m,v){try{f.contentWindow.postMessage(JSON.stringify(v===undefined?{method:m}:{method:m,value:v}),"*")}catch(e){}}
function show(){if(shown)return;shown=true;clearTimeout(fb);f.classList.add("on");setTimeout(function(){if(btn.parentNode)btn.parentNode.removeChild(btn)},650)}
function make(auto){if(f)return;f=document.createElement("iframe");f.src=src(auto);f.title=b.dataset.title;f.allow="autoplay; fullscreen; picture-in-picture";b.appendChild(f)}
window.addEventListener("message",function(ev){if(!f||ev.source!==f.contentWindow)return;var d=ev.data;if(typeof d==="string"){try{d=JSON.parse(d)}catch(e){return}}if(!d)return;
if(d.event==="ready"){ready=true;send("addEventListener","play");send("addEventListener","playProgress");if(want)send("play")}
else if(d.event==="play"){if(want)setTimeout(show,120)}
else if(d.event==="playProgress"&&d.data&&d.data.seconds>0.05){if(want)show()}});
function warm(){make(false)}
if(b===document.querySelector(".vposter")&&matchMedia("(hover: hover) and (pointer: fine)").matches)addEventListener("load",function(){setTimeout(warm,800)});
btn.addEventListener("pointerenter",warm);btn.addEventListener("focus",warm);btn.addEventListener("touchstart",warm,{passive:true});
btn.addEventListener("click",function(){if(want)return;want=true;btn.classList.add("loading");
if(!f)make(true);else if(ready)send("play");
fb=setTimeout(function(){if(!shown){f.src=src(true);fb=setTimeout(show,4000)}},2500)})})})();</script>
