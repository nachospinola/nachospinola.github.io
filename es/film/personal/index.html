  <header class="proj-head"><h1>Personal</h1></header>
  <div class="proj-body"><div class="proj-extra proj-coll"><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="86915269" data-title="Venezuela está en la calle"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/86915269.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Venezuela está en la calle</figcaption><p class="xm">Maracaibo, Venezuela · 2014</p><p class="xt">Hecho junto a amigos venezolanos para dar voz a quienes se manifiestan pacíficamente día tras día. Nace del cariño por una persona, por su familia y por su país. Mención Especial en el Concurso Nanometrajes.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="390689166" data-title="Me despertaré mañana"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/390689166.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Me despertaré mañana</figcaption><p class="xm">Málaga, España · 2019</p><p class="xt">Cortometraje documental sobre el día a día de una mujer de 85 años: sus miedos y preocupaciones, pero también sus costumbres y sus ilusiones. Un homenaje en vida para una abuela, una madre, una hija. Seleccionado en festivales de Colombia, Estados Unidos, Eslovaquia, España e Italia.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="118168728" data-title="Pa'lante mujer"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/118168728.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>Pa'lante mujer</figcaption><p class="xm">Sevilla, España · 2014</p><p class="xt">Mensaje de apoyo a todas las víctimas de violencia de género, contado por un grupo de mujeres supervivientes de la Fundación Ana Bella.</p></figure><figure class="xv xi"><div class="embed vposter" style="aspect-ratio: 1280 / 720" data-id="75562480" data-title="El último socio 2"><button class="reel-play" type="button" aria-label="Reproducir el vídeo"><img src="/assets/img/film/extras/75562480.jpg" alt="" width="1280" height="720" loading="lazy"><span class="tri" aria-hidden="true"></span></button></div><figcaption>El último socio 2</figcaption><p class="xm">Almería, España · 2012</p><p class="xt">Tráiler de un proyecto sociocultural para promover el ocio positivo entre la juventud y recaudar fondos para A Toda Vela.</p></figure></div></div>
